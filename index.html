<style>
:root{--az:#2F3B59;--vd:#1BB3AF;--vm:#9F030B;--ou:#DE9E2A;--bg:#F4F8F9;--tx:#1d2433;--mu:#566074}
*{box-sizing:border-box}body{margin:0;font-family:'Poppins','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2{font-family:'Playfair Display',Georgia,serif;color:var(--az);margin:.2em 0}.mu{color:var(--mu)}.er{color:var(--vm);font-weight:600}
.top{background:var(--az);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}.top b{flex:1}.top img{height:26px;background:#fff;border-radius:6px;padding:2px 6px}
.wrap{max-width:760px;margin:0 auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 14px rgba(47,59,89,.10)}
.btn{background:var(--az);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:600 15px inherit;cursor:pointer;transition:.2s}.btn:hover{opacity:.9}
.btn.v{background:var(--vd);color:var(--az)}.btn.g{background:#fff;color:var(--az);border:1px solid var(--az);padding:8px 12px;font-size:13px}.btn.top2{background:transparent;border:1px solid #fff;padding:6px 12px;font-size:13px}
.ent{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}.ent>*{max-width:460px;width:100%}
.logos{display:flex;justify-content:center;gap:28px;align-items:center}.logos img{height:54px;max-width:44%;object-fit:contain}
.in{width:100%;font:500 18px inherit;padding:16px;border:2px solid #cfd8dc;border-radius:14px;outline:0}.in:focus{border-color:var(--vd)}.in.s{font-size:14px;padding:9px;margin:4px 0}.in.pin{text-align:center;letter-spacing:.5em;font-size:24px}
.it{display:block;width:100%;text-align:left;background:#fff;border:1px solid #dfe6ea;border-radius:12px;padding:14px;margin:6px 0;font:500 16px inherit;cursor:pointer}.it:hover{border-color:var(--vd)}
.adm{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));right:14px;background:none;border:0;font-size:11px;color:#9aa5b1;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(20,28,45,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}.md{background:#fff;border-radius:18px;padding:22px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px}
.mapa{position:relative;height:72vh;background:#fff;border-radius:14px;overflow:hidden;touch-action:none;border:1px solid #dfe6ea}.svg{width:100%;height:100%;display:block;user-select:none}
.zb{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}.zb button{width:42px;height:42px;border-radius:12px;border:1px solid var(--az);background:#fff;font-size:22px;color:var(--az)}
.m{fill:rgba(27,179,175,.12);stroke:#1BB3AF;stroke-width:3;cursor:pointer;transition:fill .2s,stroke-width .2s}.m:hover{stroke-width:6}
.m.ocupada{fill:rgba(47,59,89,.55);stroke:#2F3B59}.m.reservada{fill:rgba(120,120,120,.5);stroke:#777}.nc{pointer-events:none}.m.minha{fill:rgba(222,158,42,.8);stroke:#9F030B;stroke-width:5}.m.sel{stroke:#9F030B;stroke-width:7}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0}.lg i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:5px;vertical-align:-2px;border:2px solid}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{white-space:nowrap;border:0;border-radius:20px;padding:9px 14px;background:#e3eaee;color:var(--az);font:600 13px inherit}.tabs .on{background:var(--az);color:#fff}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f3;flex-wrap:wrap}.row span.tag{margin-left:auto;font-size:12px;background:#e3f6f5;border-radius:10px;padding:3px 9px}
.hr{padding:7px 0;border-bottom:1px solid #edf1f3;font-size:13px}.hr small{display:block;color:var(--mu)}.go{display:flex;gap:8px;margin:8px 0}.go input{width:110px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--az);color:#fff;padding:11px 18px;border-radius:14px;z-index:20;max-width:90%;text-align:center}
#imp{display:none}@media print{body>*:not(#imp){display:none!important}#imp{display:block}}
.fix{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;border:2px solid var(--vd);box-shadow:0 -4px 20px rgba(47,59,89,.28)}
#ld{display:none;position:fixed;top:0;left:0;height:4px;width:100%;background:linear-gradient(90deg,var(--vd),var(--az));animation:ld 1s infinite;z-index:30}@keyframes ld{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
.pw{position:relative}.pw input{padding-right:54px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--az);padding:8px;cursor:pointer;line-height:0}
.top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg1{width:min(80vw,340px)!important;height:auto}.logos.peq{gap:22px}.logos.peq img{height:32px;max-width:40%;opacity:.92}
.bv{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;animation:bvin .45s ease both,bvout .5s ease 1.9s forwards}
.bv img{width:min(78vw,340px);animation:bvz .9s cubic-bezier(.2,.9,.3,1.2) both}.bv h2{font-size:26px;animation:bvin .8s ease .35s both}.bv p{color:var(--mu);margin:0;animation:bvin .8s ease .6s both}
@keyframes bvin{from{opacity:0}to{opacity:1}}@keyframes bvout{to{opacity:0}}@keyframes bvz{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.m.minha{animation:pl 1.8s ease-in-out infinite}@keyframes pl{50%{stroke-width:10}}
.bar{height:8px;background:#e3eaee;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vd),var(--az));border-radius:8px;transition:width .6s}
.cf{position:fixed;top:-16px;width:9px;height:14px;z-index:45;border-radius:2px;animation:cf 2.6s ease-in forwards}@keyframes cf{to{transform:translateY(108vh) rotate(720deg);opacity:.9}}
.fix{padding-right:54px}.xis{position:absolute;top:8px;right:10px;border:0;background:#e3eaee;color:var(--az);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}.dica{text-align:center;font-size:13px;margin:8px 0}
.m.metade{fill:url(#gm);stroke:#1BB3AF}
